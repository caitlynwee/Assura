services:

  # Applies Drizzle migrations and loads idempotent seed data into Supabase.
  db-migrate:
    build:
      context: ./web
      dockerfile: Dockerfile
    command: sh -c "npm run db:migrate && npm run db:seed && npm run db:seed-auth"
    volumes:
      - ./web/src:/app/src
      - ./web/drizzle:/app/drizzle
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      # db:seed-auth creates/links the demo Supabase identity via the admin API.
      # NEXT_PUBLIC_* are intentionally browser-exposed by design; the
      # service-role key is SERVER ONLY and must never be prefixed NEXT_PUBLIC_.
      # (seed-auth early-returns with no throw when these are empty, so a keyless
      # `docker compose up` still succeeds.)
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    restart: "no"

  mailpit:
    profiles: ["premium"]
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  mail:
    profiles: ["premium"]
    build:
      context: ./mail-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://web:3000}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-key}
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  stripe-cli:
    profiles: ["stripe"]
    image: stripe/stripe-cli:latest
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    command:
      - listen
      - --events=customer.subscription.created,customer.subscription.updated,customer.subscription.deleted
      - --forward-to
      - http://web:3000/api/stripe/webhook
    depends_on:
      web:
        condition: service_started

  scraper:
    profiles: ["scraper"]
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8100:8100"
    volumes:
      - ./scraper/app:/app/app   # hot reload
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      JINA_API_KEY: ${JINA_API_KEY:-}
      FIRE_CRAWL_API_KEY: ${FIRE_CRAWL_API_KEY:-}
      LLM_MODEL: deepseek-chat
      DEBUG_SCRAPER: ${DEBUG_SCRAPER:-}
      # Supabase Storage for stored brochure PDFs (optional; keyless = upload
      # skipped). Reuses the stack's Supabase project. The service-role key is
      # SERVER ONLY — never prefix it NEXT_PUBLIC_.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_DOCUMENTS_BUCKET: ${SUPABASE_DOCUMENTS_BUCKET:-documents}
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    environment:
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      # Supabase Auth: NEXT_PUBLIC_* are intentionally browser-exposed (anon key
      # is safe under RLS). Supabase service-role and Stripe keys are server-only;
      # never expose them via NEXT_PUBLIC_* variables.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SCRAPER_URL: ${SCRAPER_URL:-http://scraper:8100}
      MAIL_SERVICE_URL: http://mail:8200
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-key}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
