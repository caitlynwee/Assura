services:

  # ── PostgreSQL database ────────────────────────────────────────────────────
  # Single shared DB for web and scraper. Named volume persists data between
  # restarts. Health check lets db-init wait until Postgres is ready.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: assura
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── DB init (replaces init-data) ───────────────────────────────────────────
  # Runs once: applies Drizzle migrations then loads seed data.
  # Web and scraper depend on this completing successfully.
  db-init:
    build:
      context: ./web
      dockerfile: Dockerfile
    command: sh -c "npm run db:migrate && npm run db:seed"
    volumes:
      - ./web/src:/app/src           # tsx needs the source scripts
      - ./web/drizzle:/app/drizzle   # migration files
      - ./seed:/seed:ro              # seed JSON files
    environment:
      DATABASE_URL: postgres://postgres:dev@postgres:5432/assura
      SEED_DIR: /seed
    depends_on:
      postgres:
        condition: service_healthy

  # ── Mailpit email sandbox ──────────────────────────────────────────────────
  # SMTP on :1025 (internal), web UI on :8025 (host-accessible).
  # Nothing ever leaves the machine — all outbound email is captured here.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # ── Python FastAPI scraper ─────────────────────────────────────────────────
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8100:8100"
    volumes:
      - ./scraper/app:/app/app                       # hot reload
      - ./scraper/mock_brochure:/app/mock_brochure   # editable mock brochure
    environment:
      DATABASE_URL: postgres://postgres:dev@postgres:5432/assura
      WEB_BASE_URL: http://web:3000
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      LLM_MODEL: deepseek-chat
    depends_on:
      db-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # ── Next.js web app ────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./web/src:/app/src         # hot reload
      - ./web/public:/app/public   # static assets
    environment:
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET}
      HERMES_API_KEY: ${HERMES_API_KEY}
      SCRAPER_URL: http://scraper:8100
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
      DATABASE_URL: postgres://postgres:dev@postgres:5432/assura
    depends_on:
      db-init:
        condition: service_completed_successfully
      scraper:
        condition: service_started
      mailpit:
        condition: service_started

volumes:
  pgdata:
