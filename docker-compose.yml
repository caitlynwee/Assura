services:

  # Applies Drizzle migrations and loads idempotent seed data into Supabase.
  db-migrate:
    build:
      context: ./web
      dockerfile: Dockerfile
    command: sh -c "npm run db:migrate && npm run db:seed"
    volumes:
      - ./web/src:/app/src
      - ./web/drizzle:/app/drizzle
      - ./seed:/seed:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      SEED_DIR: /seed
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8100:8100"
    volumes:
      - ./scraper/app:/app/app   # hot reload
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      WEB_BASE_URL: http://web:3000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-key}
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      JINA_API_KEY: ${JINA_API_KEY:-}
      FIRE_CRAWL_API_KEY: ${FIRE_CRAWL_API_KEY:-}
      LLM_MODEL: deepseek-chat
      CURRENT_COUNTRY: ${CURRENT_COUNTRY:-Singapore}
      DEBUG_SCRAPER: ${DEBUG_SCRAPER:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    environment:
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SCRAPER_URL: http://scraper:8100
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-key}
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      scraper:
        condition: service_started
      mailpit:
        condition: service_started
