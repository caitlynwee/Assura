# Pre-commit hooks for Assura.
#
# Setup (uv-based — no global pip needed):
#   uv tool install pre-commit        # or: uvx pre-commit ...
#   pre-commit install                # installs the git hook
#
# Run against everything once:
#   pre-commit run --all-files
#
# Hooks run only on the file types they match, so a web-only commit won't
# invoke the Python hooks and vice-versa.

repos:
  # ── General hygiene ────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
      - id: check-json
        # Drizzle emits JSONC snapshots; limit to our own config dirs.
        files: ^(\.github/|scraper/|seed/).*\.json$
      - id: detect-private-key

  # ── Python (scraper) — ruff lint + format ──────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        name: ruff (scraper lint)
        files: ^scraper/
        args: ["--fix"]
      - id: ruff-format
        name: ruff (scraper format)
        files: ^scraper/

  # ── Web (Next.js) — eslint via the project's own toolchain ─────────────────
  - repo: local
    hooks:
      - id: web-eslint
        name: eslint (web)
        language: system
        files: ^web/src/.*\.(ts|tsx)$
        pass_filenames: false
        # Non-blocking until the 2 pre-existing errors on main are fixed.
        # Drop `|| true` to make it gate commits.
        entry: bash -c 'cd web && npm run lint || true'
